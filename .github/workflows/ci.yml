name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required pages exist
        run: |
          set -euo pipefail
          for f in site/index.html site/privacy/index.html site/styles.css site/assets/icon.svg; do
            test -s "$f" || { echo "::error file=$f::missing or empty"; exit 1; }
          done

      - name: Relative links resolve
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r page; do
            dir=$(dirname "$page")
            for link in $(grep -oE '(href|src)="[^"#?]+' "$page" | sed -E 's/^(href|src)="//' | grep -vE '^(https?:|mailto:|//)' || true); do
              target="$dir/$link"
              [ -d "$target" ] && target="$target/index.html"
              if [ ! -e "$target" ]; then
                echo "::error file=$page::broken link: $link"
                status=1
              fi
            done
          done < <(find site -name '*.html')
          exit $status

      - name: Validate HTML
        run: npx --yes html-validate@9.4.1 "site/**/*.html"
